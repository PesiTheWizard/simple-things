<body id="mainbody">
<table border="1" align="center">
<tbody>
<tr><td width="700"><div id="canvasholder"></div></td></tr>
<tr><td>
   <table border="1">
      <tbody>
         <tr>
            <td><input type="button" name="New Game" id="newgame" value="New Game"></td>
            <td><input type="button" name="Computer Move" id="computermove" value="Computer Move"></td>
         </tr>
         <tr>
            <td valign="top"><p>Token Style:</p>
               <table width="200" border=1>
                    <tr>
                      <td><label>
                        <input name="Token Style" type="radio" id="westernstyle" value="western" checked>
                        Western</label></td>
                    </tr>
                    <tr>
                      <td><label>
                        <input type="radio" name="Token Style" value="traditional" id="traditionalstyle">
                        Traditional</label></td>
                    </tr>
                    <tr>
                      <td><label>
                        <input type="radio" name="Token Style" value="davis" id="davisstyle">
                        Davis</label></td>
                    </tr>
                    <tr>
                      <td><label>
                        <input type="radio" name="Token Style" value="davisbw" id="davisbwstyle">
                        Davis (Black & White)</label></td>
                    </tr>
               </table>
            </td>
            <td valign="top"><p>AI Difficulty:</p>
               <table width="200" border=1>
                    <tr>
                      <td><label>
                        <input type="radio" name="AI Difficulty" value="above_average" id="above_average">
                        Above Average</label></td>
                    </tr>
                    <tr>
                      <td><label>
                        <input name="AI Difficulty" type="radio" id="average" value="average">
                        Average</label></td>
                    </tr>
                    <tr>
                      <td><label>
                        <input type="radio" name="AI Difficulty" value="novice" id="novice">
                        Novice</label></td>
                    </tr>
                    <tr>
                      <td><label>
                        <input type="radio" name="AI Difficulty" value="easy" id="easy" checked>
                        Easy</label></td>
                    </tr>
                    <tr>
                      <td><label>
                        <input type="radio" name="AI Difficulty" value="too_easy" id="too_easy">
                        Too Easy</label></td>
                    </tr>
               </table>
            </td>
         </tr>
      </tbody>
   </table>
</td></tr>

</table>
